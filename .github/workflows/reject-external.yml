name: reject-external

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  reject-external:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Close submissions from outside the owning account
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          USER_LOGIN: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
          SAME_REPO: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository }}
          ITEM_STATE: ${{ github.event.pull_request.state || github.event.issue.state }}
          ITEM_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: node scripts/reject-external.mjs
