# Example site config for https://ai-box.yogdunana.cn.
# The owner installs this on the server. This repository does not apply it.
# /api must be proxied before the SPA fallback, or Nginx will return index.html
# and the browser will treat that HTML as a successful API response.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai-box.yogdunana.cn;

    ssl_certificate /etc/letsencrypt/live/ai-box.yogdunana.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-box.yogdunana.cn/privkey.pem;

    root /var/www/ai-box;
    index index.html;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        client_max_body_size 64k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
